services:
  nginx:
    image: nginx:alpine
    ports:
      - "8354:80"
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - my_network
    depends_on:
      - app
  app:
    image: nginx:alpine
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - my_network
  
networks:
  my_network: